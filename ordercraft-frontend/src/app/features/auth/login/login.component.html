<div class="login-container">
  <div class="login-left-panel">
    <div class="branding">
      <h1>OrderCraft</h1>
      <p>Manufacturing Order Management System</p>
    </div>
  </div>
  
  <div class="login-right-panel">
    <div class="form-wrapper">
      <h2>Welcome Back</h2>
      <p class="subtitle">Please sign in to your account</p>

      <div *ngIf="errorMessage" class="error-alert">
        &#9888; {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="username">Username</label>
          <div class="input-container">
            <span class="icon">&#128100;</span>
            <input 
              type="text" 
              id="username" 
              formControlName="username" 
              placeholder="Enter your username"
              [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
          </div>
          <div class="error-message" *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            Username is required
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-container">
            <span class="icon">&#128274;</span>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="password" 
              formControlName="password" 
              placeholder="Enter your password"
              [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()" tabindex="-1">
              {{ showPassword ? '&#128064;' : '&#128065;' }}
            </button>
          </div>
          <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <button type="submit" class="submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Sign In</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>
    </div>
  </div>
</div>
